services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:3000:3000"
    devices:
      - "${SERIAL_DEVICE:-/dev/ttyUSB0}:${SERIAL_DEVICE:-/dev/ttyUSB0}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/self').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_HOST: 0.0.0.0
      VITE_API_URL: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
